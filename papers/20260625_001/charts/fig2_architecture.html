<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
body{font-family:SimSun,"Times New Roman",serif;margin:0;padding:28px;background:white;color:#222}
.title{text-align:center;font-size:18px;font-weight:bold;margin-bottom:18px}
.note{text-align:center;font-size:13px;color:#666;margin-top:10px}
svg{display:block;margin:0 auto}
.layer{fill:#f8fafb;stroke:#aab7c4;stroke-width:1.5}
.cloud{fill:#e8f1f6;stroke:#2f6f8f;stroke-width:2}
.edge{fill:#eef5ed;stroke:#3e7c59;stroke-width:2}
.car{fill:#f6efe4;stroke:#8b6f2f;stroke-width:2}
.txt{font-size:15px;text-anchor:middle;dominant-baseline:middle}
.small{font-size:12px;text-anchor:middle;fill:#555}
.arrow{stroke:#555;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style>
</head>
<body>
<div class="title">大模型参与车路云协同调度的分层架构</div>
<svg width="940" height="520" viewBox="0 0 940 520">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>
<rect class="layer" x="40" y="40" width="860" height="120" rx="10"/>
<text class="txt" x="110" y="70">云端</text>
<rect class="cloud" x="220" y="62" width="190" height="68" rx="8"/><text class="txt" x="315" y="90">大模型规划层</text><text class="small" x="315" y="114">区域策略、解释、审计</text>
<rect class="cloud" x="510" y="62" width="190" height="68" rx="8"/><text class="txt" x="605" y="90">仿真验证层</text><text class="small" x="605" y="114">冲突检查、效果评估</text>
<rect class="layer" x="40" y="205" width="860" height="120" rx="10"/>
<text class="txt" x="110" y="235">路侧</text>
<rect class="edge" x="190" y="227" width="180" height="68" rx="8"/><text class="txt" x="280" y="255">边缘控制器</text><text class="small" x="280" y="279">低延迟执行</text>
<rect class="edge" x="470" y="227" width="180" height="68" rx="8"/><text class="txt" x="560" y="255">路侧感知</text><text class="small" x="560" y="279">排队、行人、事故</text>
<rect class="edge" x="700" y="227" width="150" height="68" rx="8"/><text class="txt" x="775" y="255">信号设备</text><text class="small" x="775" y="279">相位与绿灯</text>
<rect class="layer" x="40" y="370" width="860" height="95" rx="10"/>
<text class="txt" x="110" y="400">车端</text>
<rect class="car" x="210" y="390" width="190" height="52" rx="8"/><text class="txt" x="305" y="416">联网车辆数据</text>
<rect class="car" x="530" y="390" width="190" height="52" rx="8"/><text class="txt" x="625" y="416">自动驾驶反馈</text>
<path class="arrow" d="M305 390 C310 350,450 330,560 295"/>
<path class="arrow" d="M625 390 C630 345,620 325,590 295"/>
<path class="arrow" d="M560 227 C555 185,390 155,330 130"/>
<path class="arrow" d="M410 96 L510 96"/>
<path class="arrow" d="M605 130 C600 170,350 200,300 227"/>
<path class="arrow" d="M370 262 L700 262"/>
</svg>
<div class="note">资料来源：根据文献[7][10][11][14]整理</div>
</body>
</html>
