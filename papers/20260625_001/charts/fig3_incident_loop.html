<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
body{font-family:SimSun,"Times New Roman",serif;margin:0;padding:30px;background:#fff;color:#222}
.title{text-align:center;font-size:18px;font-weight:bold;margin-bottom:18px}
.note{text-align:center;font-size:13px;color:#666;margin-top:8px}
svg{display:block;margin:0 auto}
.box{fill:#f0f4f8;stroke:#2e6f8e;stroke-width:2;rx:8}
.box2{fill:#f7f3e8;stroke:#8b6f2f;stroke-width:2;rx:8}
.box3{fill:#edf5ef;stroke:#3e7c59;stroke-width:2;rx:8}
.txt{font-size:15px;text-anchor:middle;dominant-baseline:middle}
.small{font-size:12px;fill:#555;text-anchor:middle}
.arrow{stroke:#555;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style>
</head>
<body>
<div class="title">大模型辅助异常交通事件响应闭环</div>
<svg width="920" height="500" viewBox="0 0 920 500">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>
<rect class="box" x="70" y="80" width="160" height="70"/><text class="txt" x="150" y="106">事件识别</text><text class="small" x="150" y="130">事故、施工、拥堵</text>
<path class="arrow" d="M230 115 L315 115"/>
<rect class="box" x="320" y="80" width="160" height="70"/><text class="txt" x="400" y="106">影响评估</text><text class="small" x="400" y="130">范围、延误、风险</text>
<path class="arrow" d="M480 115 L565 115"/>
<rect class="box2" x="570" y="80" width="190" height="70"/><text class="txt" x="665" y="106">大模型生成方案</text><text class="small" x="665" y="130">相位、绕行、诱导</text>
<path class="arrow" d="M665 150 L665 220"/>
<rect class="box3" x="570" y="225" width="190" height="70"/><text class="txt" x="665" y="251">仿真与规则验证</text><text class="small" x="665" y="275">冲突检查、效果预估</text>
<path class="arrow" d="M570 260 L480 260"/>
<rect class="box3" x="320" y="225" width="160" height="70"/><text class="txt" x="400" y="251">人工审核</text><text class="small" x="400" y="275">选择、修改、批准</text>
<path class="arrow" d="M320 260 L230 260"/>
<rect class="box" x="70" y="225" width="160" height="70"/><text class="txt" x="150" y="251">策略下发</text><text class="small" x="150" y="275">信号、诱导、提示</text>
<path class="arrow" d="M150 295 C155 365,315 390,400 370"/>
<rect class="box" x="320" y="340" width="160" height="70"/><text class="txt" x="400" y="366">效果反馈</text><text class="small" x="400" y="390">排队、速度、清除时间</text>
<path class="arrow" d="M480 375 C635 395,775 275,760 150"/>
</svg>
<div class="note">资料来源：根据文献[5][6][11]整理</div>
</body>
</html>
